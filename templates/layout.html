<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="/static/styles.css" rel="stylesheet">
        <title>{% block title %}{% endblock %} </title>

    </head>
    <body class="d-flex flex-column min-vh-100">
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#appMenu" aria-controls="appMenu" aria-label="Open navigation menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <a class="navbar-brand ms-2" href="/index.html">SaveIt</a>
            </div>
        </nav>

        <div class="offcanvas offcanvas-start" data-bs-scroll="true" tabindex="-1" id="appMenu" aria-labelledby="appMenuLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="appMenuLabel">SaveIt</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="list-group">
                    <a href="/index.html" class="list-group-item list-group-item-action">Home</a>
                    {% if session.get("user_id") %}
                        <a href="/analytics.html" class="list-group-item list-group-item-action">Analytics</a>
                        <a href="/calendar.html" class="list-group-item list-group-item-action">Calendar</a>
                        <hr>
                        <a href="/profile.html" class="list-group-item list-group-item-action">Profile</a>
                        <a href="/settings.html" class="list-group-item list-group-item-action">Settings</a>
                    {% else %}
                        <a href="/login.html" class="list-group-item list-group-item-action">Login/Register</a>
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="page d-flex flex-column flex-grow-1">
            <main class="container mt-5 flex-grow-1">
                {% block main %}{% endblock %}
            </main>
            <footer class="bg-body-tertiary text-center text-lg-start mt-auto">
                <div class="container">
                    <p class="text-center text-muted">
                        &copy; 2026 Expense Tracker. All rights reserved.
                    </p>
                </div>
            </footer>
        </div>
    </body>
</html>
