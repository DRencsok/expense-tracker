{% extends "layout.html" %}

{% block title %}Settings{% endblock %}

{% block main %}
    <h1 class="text-info-emphasis">Settings</h1>
    <hr>
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}
    <div class="text-center">
    <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#changePasswordModal">Change password</button>
    <!-- Modal for password change-->
     <form method="post" action="{{ url_for('main.settings')}}" >
     <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePassword" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Change password</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
         <input type="password" name="oldPassword" placeholder="Old Password" class="form-control mb-2">
         <input type="password" name="newPassword" placeholder="New Password" class="form-control mb-2" minlength="8">
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-danger" name="change_password">Change</button>
        </div>
        </div>
    </div>
    <hr>
    </div>
     </form>
    <!-- Modal for username change-->
     <hr>
      <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#changeUsernameModal">Change username</button>
     <form method="post" action="{{ url_for('main.settings')}}" >
     <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="modal fade" id="changeUsernameModal" tabindex="-1" aria-labelledby="changeUsername" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Change Username</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
         <input type="text" name="newUsername" placeholder="New Username" class="form-control mb-2">
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-danger" name="change_username">Change</button>
        </div>
        </div>
    </div>
    </div>
     </form>

     </div>
{% endblock %}
